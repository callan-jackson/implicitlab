name: deploy

# Continuous deployment to the Hugging Face Space. Runs only after the test
# workflow has passed on main, so a red build never reaches the live demo.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    env:
      HF_SPACE: ${{ vars.HF_SPACE }}          # e.g. callan-jackson/implicitlab
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Assemble the Space
        # A Space reads its configuration from YAML front matter in README.md.
        # The GitHub README stays clean; the Space gets its own copy with the
        # header prepended.
        run: |
          mkdir space
          cp -r app static Dockerfile .dockerignore requirements.txt space/
          {
            printf -- '---\ntitle: ImplicitLab\nemoji: 🧪\ncolorFrom: indigo\ncolorTo: purple\nsdk: docker\napp_port: 7860\npinned: false\nshort_description: Implicit association testing and cohort analytics\n---\n\n'
            cat README.md
          } > space/README.md

      - name: Push to Hugging Face
        run: |
          cd space
          git init -q -b main
          git config user.name "deploy-bot"
          git config user.email "deploy@users.noreply.huggingface.co"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
