name: keep-alive

# Render's free tier puts a service to sleep after 15 minutes without traffic,
# and the first visit afterwards waits ~30 s for a cold start. Pinging the
# health endpoint every 5 minutes keeps it warm. GitHub runs schedules on a
# best-effort basis, so the short interval leaves slack for delayed runs.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the live site
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 90 \
            https://implicitlab.onrender.com/api/health
