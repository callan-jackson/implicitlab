# Render Blueprint: one free web service built from the Dockerfile.
#
# Deploys follow GitHub: with autoDeployTrigger "checksPass", Render waits for
# the repository's CI checks (the test workflow) to pass on a commit before it
# deploys that commit, so a red build never reaches the live demo.
services:
  - type: web
    name: implicitlab
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
