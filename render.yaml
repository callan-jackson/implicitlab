# Render Blueprint: one free web service built from the Dockerfile.
#
# Deploys are triggered by .github/workflows/deploy.yml through the service's
# deploy hook, only after the test workflow passes on a commit, so a red build
# never reaches the live demo.
services:
  - type: web
    name: implicitlab
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: false  # deploys come from .github/workflows/deploy.yml after CI passes
    envVars:
      - key: ENVIRONMENT
        value: production
